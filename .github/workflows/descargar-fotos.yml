name: Descargar fotos de producto
on:
  push:
    paths: ["ads/fuentes.txt"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar y convertir a JPG
        run: |
          mkdir -p ads/img
          while read -r name url; do
            [ -z "$name" ] && continue
            ext="${url##*.}"
            curl -sSfL "$url" -o "ads/img/$name.$ext" || echo "fallo $name"
          done < ads/fuentes.txt
          ls -la ads/img
      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add ads/img
          git commit -m "Fotos de producto para anuncios" || exit 0
          git push
