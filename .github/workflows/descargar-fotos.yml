name: Descargar fotos de producto
on:
  push:
    paths: ["ads/fuentes.txt"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar y convertir a JPG
        run: |
          sudo apt-get -qq install -y webp >/dev/null
          mkdir -p ads/img
          while read -r name url; do
            [ -z "$name" ] && continue
            curl -sSfL "$url" -o "/tmp/$name.src" || { echo "fallo $name"; continue; }
            if file "/tmp/$name.src" | grep -qi webp; then dwebp -quiet "/tmp/$name.src" -o "/tmp/$name.png"; else cp "/tmp/$name.src" "/tmp/$name.png"; fi
            python3 -c "from PIL import Image;Image.open('/tmp/$name.png').convert('RGB').save('ads/img/$name.jpg',quality=92)" 2>/dev/null || convert "/tmp/$name.png" -quality 92 "ads/img/$name.jpg"
          done < ads/fuentes.txt
          ls -la ads/img
      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add ads/img
          git commit -m "Fotos de producto para anuncios" || exit 0
          git push
